<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none;
      cursor: default;
    }
    /* 气泡窗口整体永久鼠标穿透（主进程 setIgnoreMouseEvents(true)），
       所以这里的元素完全不用考虑点击，只管好看。 */
    #wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      padding-left: 8px;                 /* 右侧气泡：给左边尖角留位置 */
      box-sizing: border-box;
      opacity: 0; transition: opacity 140ms linear;
    }
    #wrap.left { padding-left: 0; padding-right: 8px; }
    #wrap.show { opacity: 1; }
    #bubble {
      box-sizing: border-box; width: 100%; max-height: 100%;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
      background: #fffafc; color: #33202f;
      border: 1.4px solid #f0b3d0; border-radius: 10px;
      padding: 4px 7px;
      font: 12px/1.32 "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
      text-align: left; white-space: normal; word-break: break-word; overflow: hidden;
      box-shadow: 0 2px 7px rgba(120,60,90,0.3), 0 0 0 1px rgba(255,255,255,0.6) inset;
    }
    /* 指向角色的小尖角：气泡在右 → 尖角朝左；气泡翻到左边 → 尖角朝右 */
    #wrap::before {
      content: "";
      position: absolute; left: 0; top: 50%; margin-top: -6px;
      width: 0; height: 0;
      border: 7px solid transparent; border-left: 0;
      border-right-color: #fffafc;
      filter: drop-shadow(-1.5px 0 0 #f0b3d0);
    }
    #wrap.left::before {
      left: auto; right: 0;
      border-left: 7px solid transparent; border-left-color: #fffafc;
      border-right: 0;
      filter: drop-shadow(1.5px 0 0 #f0b3d0);
    }
  </style>
</head>
<body>
  <div id="wrap"><div id="bubble"></div></div>
  <script>
    const wrap = document.getElementById("wrap");
    const bubble = document.getElementById("bubble");
    let hideTimer = null;
    window.bubbleAPI.onShow(({ text, ms, side }) => {
      wrap.classList.toggle("left", side === "left");
      bubble.textContent = String(text || "");
      wrap.classList.add("show");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => wrap.classList.remove("show"), ms || 3200);
    });
    window.bubbleAPI.onSide((side) => wrap.classList.toggle("left", side === "left"));
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none;
      cursor: grab;
    }
    body.dragging { cursor: grabbing; }
    /* 窗口 = 角色本体的正方形。气泡在**另一个**透明窗口里（见 bubble.html）：
       这样宠物窗口永远不需要"开/关鼠标穿透"，右键和拖拽就不会再被窗口样式切换打断。 */
    #stage {
      position: relative; width: 100%; height: 100%;
    }
    #pet {
      position: absolute; inset: 0;
      transform-origin: center bottom;
      transition: transform 90ms linear;
      will-change: transform;
    }
    .layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; image-rendering: auto;
      transition: opacity 180ms linear, filter 180ms linear;
    }
    .layer.hidden { opacity: 0; }
    #stage.grab-hint #pet { filter: drop-shadow(0 0 5px rgba(236,108,152,0.95)); }
    /* Live2D 式网格变形画布（铺满角色区，形变交给 WebGL 网格） */
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pet">
      <img id="frameA" class="layer" draggable="false" />
      <img id="frameB" class="layer hidden" draggable="false" />
      <canvas id="gl"></canvas>
    </div>
  </div>
  <script src="./live2d.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
